target:
  channel: tcp
  tcp:
    host: 0.0.0.0
    port: 4560
    timeout_s: 600.0
  # ╔══════════════════════════════════════════════════════════════════════╗
  # ║  ⚠️  Transport يحدّد Score النهائي — اختر بحذر                        ║
  # ╠══════════════════════════════════════════════════════════════════════╣
  # ║  Ethernet  → MPC ≈ 24-26 ms → Score 82/100 ✅ (الموصى به)            ║
  # ║  USB tunnel → MPC ≈ 51-55 ms → Score 67-70/100 ❌                     ║
  # ║                                                                      ║
  # ║  السبب: adbd daemon على الهاتف يستهلك 10-15% من cpu7 لمعالجة         ║
  # ║  packets MAVLink، مزاحماً rocket_mpc على نفس النواة. التفاصيل في:    ║
  # ║  PIL_TRANSPORT_FINDING_2026-05-06.md                                ║
  # ╚══════════════════════════════════════════════════════════════════════╝
  #
  # mavlink_tcp.host:
  #   * Ethernet (موصى به): IP الهاتف على شبكة Ethernet المشتركة
  #     (مثل 10.42.0.145). يحتاج USB-C→Ethernet adapter أو reverse tethering.
  #     على الهاتف: `setprop debug.m130.target_ip <LAPTOP_IP>` (مثل 10.42.0.1).
  #     بدون أي `adb reverse` أو `adb forward`.
  #   * USB tunnel (للتشخيص فقط): "127.0.0.1" مع
  #     `adb reverse tcp:4560 tcp:4560 && adb reverse tcp:5760 tcp:5760`.
  mavlink_tcp:
    host: 127.0.0.1
    port: 5760
  serial:
    device: /dev/ttyACM0
    baud: 921600
clock:
  # "lockstep" (recommended): ننتظر HIL_ACTUATOR_CONTROLS من PX4 قبل تقدّم
  # الديناميكا. يُزيل TCP/scheduler jitter، يطابق سلوك Gazebo SITL، ويعطي
  # نتائج قابلة للتكرار مستقلاً عن أداء realtime للجهاز.
  # "realtime": pacing بـ wall-clock (قد يفشل إذا MPC latency > dt).
  mode: lockstep
  # MPC cycle rate للـ sync (يجب أن يطابق rate في RocketMPC.cpp ScheduleOnInterval).
  # حُدّث إلى 50Hz بعد إزالة MHE (المعدل القديم 25Hz كان hack لـARM64 مع MHE).
  mpc_cycle_hz: 25.0
  # timeout لكل sync point — إذا MPC لم يرد، نتابع بـ last actuator.
  lockstep_timeout_s: 1.0
  max_dropped_msgs: 10
  # realtime_pacing: true → بعد استلام actuator، ننام حتى wall-clock يلحق
  # sim time (hybrid lockstep — نفس مبدأ /hil). MPC solve time يأكل من
  # budget الـ 40ms تماماً كالطيران الحقيقي.
  #  • false = lockstep نقي (للتشخيص والتكرارية — MPC solve مخفي).
  #  • true  = hybrid lockstep (واقعي — يكشف ضعف المعالج).
  # هاتف قوي يحقق 100/100 في الحالتين. هاتف ضعيف ينهار مع true فقط.
  realtime_pacing: true
  # Compute-delay injection: حقن MPC solve time المقاس على الهاتف في الفيزياء.
  # ✨ يجعل lockstep أكثر واقعية:
  #    • lockstep الكلاسيكي يخفي MPC solve time → نتيجة مثالية حتى مع CPU بطيء
  #    • مع inject_compute_delay: الـactuator يُطبَّق بعد mpc_us من sim_T
  #      كما يحدث في الطيران الحقيقي
  # المصدر: DEBUG_FLOAT_ARRAY RktGNC[47] (mpc_us). يحتاج adb forward tcp:5760.
  # القيمة: max compute delay clamp (ms). إذا 0 → معطّل (يطبّق فوراً).
  inject_compute_delay_max_ms: 80
timing:
  enabled: true
  deadline_us: 20000
  warn_us: 10000
  sample_hz: 50
warmup:
  # المدة القصوى لانتظار تسليم PX4 ووصول أول HIL_ACTUATOR_CONTROLS.
  duration_s: 30.0
  # مهلة استقرار إضافية بعد أول actuator msg قبل بدء حلقة الرحلة.
  # اختُبِر warmup 40s ولم يُقرّب trajectory من SITL (بل زاد الاختلاف):
  # فرق peak altitude بين SITL و PIL ليس EKF2 transient، بل numerical
  # differences بين ARM64 NEON و x86_64 SSE في MPC/MHE solver iterations.
  # هذا فرق واقعي بين architectures لا يمكن إصلاحه عبر config.
  settle_after_arm_s: 15.0
  # إذا لم تصل أي HIL_ACTUATOR_CONTROLS خلال warm-up، أفشل صراحةً بدلاً من
  # المتابعة بأصفار (SYS_HITL=0 أو simulator_mavlink غير متصل هي الأسباب الشائعة).
  abort_on_no_actuator: true
scenario:
  sim_config: config/6dof_config_advanced.yaml
  duration_s: 500.0
  dt_s: 0.01
  random_seed: 42
output:
  results_dir: 6DOF_v4_pure/pil/results
  csv_name: pil_flight.csv
  timing_csv: pil_timing.csv
