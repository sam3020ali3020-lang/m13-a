[pytest]
# Property-based tests via Hypothesis
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Hypothesis profile: زيادة عدد العيّنات لاكتشاف حالات أقل شيوعًا
# استخدم HYPOTHESIS_PROFILE=ci في CI لتوسيع المدى
addopts = -v --tb=short

filterwarnings =
    ignore::DeprecationWarning
