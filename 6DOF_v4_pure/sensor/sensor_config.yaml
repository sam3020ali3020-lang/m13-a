# ==========================================================================
# /sensor — إعدادات اختبار الحساسات
# Sensor Test Configuration
# ==========================================================================

# اتصال MAVLink بالهاتف (عبر adb forward tcp:5760 tcp:5760)
connection:
  host: "127.0.0.1"
  port: 5760
  protocol: tcp
  timeout_s: 10.0               # مهلة الاتصال

# معدلات بثّ MAVLink المطلوبة (µs بين الرسائل)
# SET_MESSAGE_INTERVAL: interval_us = 1e6 / rate_hz
mavlink_streams:
  # PX4 على الهاتف يعمل بـ -r 40000 (40 KB/s budget).
  # HIGHRES_IMU ≈ 74 bytes → 100 Hz = 7.4 KB/s (واقعي مع باقي streams).
  # المعدل الافتراضي بدون طلب: HIGHRES_IMU=10Hz, GPS=5Hz, PRESSURE=1Hz.
  # SET_MESSAGE_INTERVAL يرفع المعدل.
  highres_imu:                  # msg 105 — accel+gyro+mag+baro+temp
    msg_id: 105
    rate_hz: 100                # واقعي مع 40KB/s budget (أعلى معدل مستقر)
  scaled_pressure:              # msg 29 — baro pressure + temperature
    msg_id: 29
    rate_hz: 10                 # أعلى من الافتراضي (1Hz)
  gps_raw_int:                  # msg 24 — GPS fix, lat/lon, HDOP, sats
    msg_id: 24
    rate_hz: 5                  # يبقى كما هو (GPS hardware limit)
  attitude:                     # msg 30 — EKF2 roll/pitch/yaw (for frame check)
    msg_id: 30
    rate_hz: 30                 # أعلى من الافتراضي (15Hz)
  system_time:                  # msg 2 — PX4 time sync
    msg_id: 2
    rate_hz: 1

# ==========================================================================
# إعدادات كل اختبار
# ==========================================================================

tests:
  # ── Test 1: Static — أرضية الضجيج والانحياز ──
  static:
    duration_s: 300               # 5 دقائق
    warmup_s: 10                  # تجاهل أول 10 ثوانٍ (استقرار)
    description_ar: "الهاتف ثابت على سطح مستوٍ — بدون أي حركة"

  # ── Test 2: Allan Variance ──
  allan:
    duration_s: 1800              # 30 دقيقة (الافتراضي)
    warmup_s: 30
    tau_min_s: 0.005              # أصغر cluster time
    tau_max_s: 1000.0             # أكبر cluster time
    tau_points: 100               # عدد نقاط τ (logarithmic)
    description_ar: "الهاتف ثابت تماماً لمدة طويلة — لا يُلمس"

  # ── Test 3: Rate Verification ──
  rates:
    duration_s: 60
    warmup_s: 5
    description_ar: "فحص معدلات العينات والـ jitter"

  # ── Test 4: Frame Verification ──
  frame:
    hold_s: 10                    # مدة تثبيت كل وضعية
    positions:                    # الوضعيات المطلوبة
      - name: "flat_screen_up"
        description_ar: "الهاتف مسطّح — الشاشة للأعلى"
        expected_accel_frd: [0, 0, -9.81]   # FRD: Z=-g (down)
        tolerance_ms2: 1.0
      - name: "vertical_top_up"
        description_ar: "الهاتف عمودي — الأعلى للأعلى (forward=up)"
        # accelerometer reads anti-gravity. forward(X_FRD) = up_world →
        # anti-gravity = +up_world = +X_FRD → expected accel = (+g, 0, 0)
        expected_accel_frd: [9.81, 0, 0]    # FRD: X=+g (forward=up)
        tolerance_ms2: 1.0
      - name: "right_side_down"
        description_ar: "الهاتف مائل — الجانب الأيمن للأسفل"
        expected_accel_frd: [0, -9.81, 0]   # FRD: Y=-g
        tolerance_ms2: 1.5
    description_ar: "التحقق من phone_to_frd() — وضعيات يدوية"

  # ── Test 5: Temperature Drift ──
  temperature:
    duration_s: 600               # 10 دقائق
    warmup_s: 0                   # لا warmup — نريد رؤية التغيّر من البارد
    stress_cpu: true              # اختياري: تشغيل حمل CPU لتسخين الهاتف
    description_ar: "تسجيل مستمر مع تغيّر حرارة الهاتف"

  # ── Test 6: GPS Performance ──
  gps:
    duration_s: 300               # 5 دقائق
    warmup_s: 60                  # انتظار أول fix
    require_3d_fix: true
    description_ar: "GPS ثابت في مكان مكشوف"

  # ── Test 7: Vibration Susceptibility ──
  vibration:
    duration_s: 60
    warmup_s: 5
    fft_window: "hanning"
    fft_nperseg: 1024
    description_ar: "الهاتف على سطح يهتزّ (أو بجانب محرك)"

  # ── Test 8: Dynamic Range ──
  dynamic_range:
    duration_s: 30
    description_ar: "فحص نطاق الحساسات وقراءة المواصفات"

# ==========================================================================
# عتبات PASS / FAIL (GO / NO-GO)
# ==========================================================================

thresholds:
  imu:
    # معدل العينات
    min_rate_hz: 50               # FAIL إذا أقل (عبر MAVLink، ليس مباشرة)
    nominal_rate_hz: 100          # المتوقع (حد MAVLink budget 40KB/s)
    max_jitter_pct: 20.0          # % — أقصى jitter مسموح

    # ضجيج (static، مقاس بـ std)
    accel_noise_max_ms2: 0.5      # m/s² — PASS إذا أقل
    accel_noise_fail_ms2: 1.0     # m/s² — FAIL إذا أكثر
    gyro_noise_max_rads: 0.01     # rad/s — PASS إذا أقل
    gyro_noise_fail_rads: 0.02    # rad/s — FAIL إذا أكثر

    # استقرار الانحياز (Allan variance)
    gyro_bias_instability_max_dph: 10.0    # °/hr — PASS
    gyro_bias_instability_fail_dph: 50.0   # °/hr — FAIL
    accel_bias_instability_max_mg: 0.5     # mg — PASS
    accel_bias_instability_fail_mg: 2.0    # mg — FAIL

    # الانجراف الحراري
    gyro_temp_drift_max_rads_per_C: 0.01   # rad/s/°C
    accel_temp_drift_max_ms2_per_C: 0.2    # m/s²/°C

    # النطاق الديناميكي
    gyro_min_range_dps: 2000.0    # °/s — FAIL إذا أقل
    accel_min_range_g: 16.0       # g — FAIL إذا أقل

    # اهتزاز
    max_clipping_pct: 0.0         # % — أي clipping = FAIL

  mag:
    min_rate_hz: 25
    noise_max_gauss: 0.01

  baro:
    min_rate_hz: 10
    noise_max_m: 2.0              # m equivalent altitude noise

  gps:
    min_rate_hz: 4
    max_hdop: 2.0
    min_satellites: 8
    max_cep_m: 3.0                # circular error probable
    max_vel_noise_ms: 0.3         # m/s velocity noise
    require_3d_fix: true

# ==========================================================================
# مجموعات الاختبار المسبقة
# ==========================================================================

presets:
  quick:                          # ~3 دقائق
    tests: [static, rates, dynamic_range]
    overrides:
      static:
        duration_s: 60
        warmup_s: 5

  standard:                       # ~15 دقيقة
    tests: [static, rates, frame, gps, dynamic_range]

  full:                           # ~45 دقيقة
    tests: [static, allan, rates, frame, temperature, gps, vibration, dynamic_range]
    overrides:
      allan:
        duration_s: 1800

  allan_long:                     # ~2 ساعات
    tests: [allan]
    overrides:
      allan:
        duration_s: 7200
