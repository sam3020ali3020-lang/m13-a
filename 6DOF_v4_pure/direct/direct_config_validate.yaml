# ════════════════════════════════════════════════════════════════════════════
#  /direct — Tier-1 Validation suite (all 4 servos)
#  Override --pattern via CLI to run each test:
#    python3 direct_runner.py -c direct_config_validate.yaml -p linearity
#    python3 direct_runner.py -c direct_config_validate.yaml -p hold_drift
#    python3 direct_runner.py -c direct_config_validate.yaml -p end_stop
#    python3 direct_runner.py -c direct_config_validate.yaml -p bus_health
#    python3 direct_runner.py -c direct_config_validate.yaml -p rate_limit_verify
# ════════════════════════════════════════════════════════════════════════════

can:
  backend: xqpower_bus
  xqpower_bus:
    node_ids: [1, 2, 3, 4]
    poll_interval_us: 5000

xqpower:
  node_ids: [0x01, 0x02, 0x03, 0x04]
  angle_limit_deg: 20.0           # رفعنا الحدّ لاختبار end_stop
  units_per_deg: 18.0
  report_interval_ms: 10
  poll_interval_ms: 5

safety:
  zero_before_s: 0.5
  zero_after_s: 0.5
  zero_on_exit: true
  max_angle_abs_deg: 20.0
  warmup_exercise_s: 2.0
  warmup_amp_deg: 1.0
  online_min_samples: 3
  online_settle_std_deg: 0.10
  min_fb_rate_hz: 30.0

pattern:
  name: linearity                  # placeholder — تُتجاوز بـ -p
  servos: [0, 1, 2, 3]             # ⭐ كلّ السيرفوهات

  linearity:
    max_amp_deg: 18.0
    step_deg: 1.0
    dwell_s: 0.6
    pre_settle_s: 0.5
    cycles: 1

  hold_drift:
    positions_deg: [-10.0, -5.0, 0.0, 5.0, 10.0]
    settle_s: 0.5
    hold_s: 15.0                   # خَفّضنا من 30 إلى 15s لتسريع الاختبار
    pre_settle_s: 1.0

  end_stop:
    target_deg: 18.0
    ramp_rate_dps: 30.0
    hold_s: 2.0
    pre_settle_s: 0.5

  bus_health:
    duration_s: 30.0
    amp_deg: 3.0
    period_s: 1.0
    pre_settle_s: 0.5

  rate_limit_verify:
    amplitudes_deg: [2.0, 5.0, 10.0, 15.0, 18.0]
    dwell_s: 0.8
    repeats: 2
    pre_settle_s: 0.5

  # ═══════════════════════ Tier-2 validation ═══════════════════════
  dead_band:
    amplitudes_deg: [0.025, 0.05, 0.10, 0.15, 0.20, 0.30, 0.50, 1.0]
    dwell_s: 1.0
    repeats: 3
    pre_settle_s: 1.0

  stiction:
    ramp_amp_deg: 1.0
    ramp_dur_s: 5.0           # 0.2°/s — slow approach to detect breakaway
    rest_s: 2.0
    n_cycles: 3
    pre_settle_s: 1.0

  cold_start:
    idle_s: 30.0              # 30s سَكون قبل أوّل step
    step_amp_deg: 5.0
    step_dwell_s: 1.0
    n_steps: 3                # cold + warm + hot
    pre_settle_s: 0.5

  endurance:
    duration_min: 5.0         # 5 دقائق للاختبار السريع — رفعها لـ 30 لـ stress test كامل
    amp_deg: 8.0
    period_s: 1.0
    pre_settle_s: 0.5
    analysis_window_s: 60.0

  # mission_replay: استَخدم pattern.name = "replay" مع pattern.replay.csv_path
  # (ينظر إلى patterns/replay.py للـ CSV من رحلة سابقة)

output:
  results_dir: results
  csv_prefix: direct_v1            # tier-1 prefix
  html_plot: true

loop:
  cmd_rate_hz: 100
