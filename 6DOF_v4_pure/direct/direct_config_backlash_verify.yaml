# ════════════════════════════════════════════════════════════════════════════
#  /direct — backlash verification test (all 4 servos, fresh run)
# ════════════════════════════════════════════════════════════════════════════

can:
  backend: xqpower_bus
  xqpower_bus:
    node_ids: [1, 2, 3, 4]
    poll_interval_us: 5000

xqpower:
  node_ids: [0x01, 0x02, 0x03, 0x04]
  angle_limit_deg: 10.0
  units_per_deg: 18.0
  report_interval_ms: 10
  poll_interval_ms: 5

safety:
  zero_before_s: 0.5
  zero_after_s: 0.5
  zero_on_exit: true
  max_angle_abs_deg: 20.0
  warmup_exercise_s: 2.0
  warmup_amp_deg: 1.0
  online_min_samples: 3
  online_settle_std_deg: 0.10
  min_fb_rate_hz: 30.0

pattern:
  name: backlash
  servos: [0, 1, 2, 3]    # all 4 servos

  backlash:
    amplitude_deg: 5.0
    step_deg: 0.1
    dwell_s: 0.10
    cycles: 2

output:
  results_dir: results
  csv_prefix: direct_blverify
  html_plot: true

loop:
  cmd_rate_hz: 100
