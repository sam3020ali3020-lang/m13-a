# ════════════════════════════════════════════════════════════════════════════
#  /direct — firmware_audit: مُقارَنَة سُلوك firmware لكلّ السيرفوهات
# ════════════════════════════════════════════════════════════════════════════
#
#  يُرسِل نَفس cmd لكلّ السيرفوهات في وَقت مُتَزامِن ويُقارِن fb.
#  يَكشِف اختِلافات داخِليَّة في firmware السيرفوهات.
#
#  ⚠️ يَستَخدِم angle_limit مَرفوع لاختِبار حَتَّى ±30°.
#
#  الاستِخدام:
#    python3 direct_runner.py --config direct_config_firmware_audit.yaml
# ────────────────────────────────────────────────────────────────────────────

can:
  backend: xqpower_bus
  xqpower_bus:
    node_ids: [1, 2, 3, 4]
    poll_interval_us: 5000

xqpower:
  node_ids: [0x01, 0x02, 0x03, 0x04]
  angle_limit_deg: 35.0     # يَكفي لـ ±30° في pos/neg_values
  units_per_deg: 18.0
  report_interval_ms: 10
  poll_interval_ms: 5

safety:
  zero_before_s: 0.5
  zero_after_s: 0.5
  zero_on_exit: true
  max_angle_abs_deg: 40.0
  warmup_exercise_s: 2.0
  warmup_amp_deg: 1.0
  online_min_samples: 3
  online_settle_std_deg: 0.10
  min_fb_rate_hz: 30.0

pattern:
  name: firmware_audit
  servos: [0, 1, 2, 3]       # كلّ السيرفوهات (نَفس cmd للجَميع)

  firmware_audit:
    pos_values_deg: [5, 10, 13, 14, 14.5, 15, 16, 18, 20, 25, 30]
    neg_values_deg: [-5, -10, -13, -14, -14.5, -15, -16, -18, -20, -25, -30]
    dwell_s: 1.5
    pre_settle_s: 1.0
    return_to_zero_between: true

output:
  results_dir: results
  csv_prefix: direct_fwaudit
  html_plot: true

loop:
  cmd_rate_hz: 100
